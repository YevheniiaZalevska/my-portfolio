<section id="statistics">

      <span data-lang="wv">Web Vitals</span>
    </h2>

    <div class="cert-content">
      <button class="cert-card zoomable" type="button">
        <img
          class="cert-img vp"

        />

      <button class="cert-card zoomable" type="button">

        />

      </button>

      <button class="cert-card zoomable" type="button">

          class="cert-img vp"
